name: near_ease
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

#-----------PACKAGES -----------#

dependencies:
  flutter:
    sdk: flutter

#-----UTILITY PACKAGES -----#
  cupertino_icons: ^1.0.8


#----------STATE MANAGEMENT PACKAGES-------#

#----Product Specific -------#


#---------- ./PACKAGES END -------#

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  #---------LOCAL ASSETS -------#
  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/

  #---------Fonts -------#
  fonts:
  - family: Poppins
    fonts:
    - asset: assets/fonts/Poppins-Light.ttf
      weight: 300
    - asset: assets/fonts/Poppins-Regular.ttf
    - asset: assets/fonts/Poppins-Medium.ttf
      weight: 500
    - asset: assets/fonts/Poppins-MediumItalic.ttf
      weight: 500
      style: italic
    - asset: assets/fonts/Poppins-SemiBold.ttf
      weight: 600
    - asset: assets/fonts/Poppins-Bold.ttf
      weight: 700